<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>烟迹 · 完整目录模型</title>
<style>
:root{--ink:#18322b;--green:#1d7d5a;--line:#dbe8e0;--paper:#f7fbf8;--orange:#bb6b18}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}main{max-width:480px;margin:auto;min-height:100vh;padding:24px 18px 36px}.eyebrow{font-size:12px;letter-spacing:1.3px;color:#668077}.top{display:flex;justify-content:space-between;align-items:start}.top h1{margin:5px 0 2px;font-size:30px}.date{font-size:13px;color:#71857c;padding-top:9px}.card{margin-top:18px;border:1px solid var(--line);border-radius:24px;background:#fff;padding:20px;box-shadow:0 10px 26px #1c49390a}.today{background:linear-gradient(135deg,#215d48,#1b805b);color:#fff;border:0}.today small{opacity:.75}.number{font-size:58px;line-height:1;font-weight:800;margin:10px 0}.lung{width:126px;height:106px;margin:8px auto 16px;position:relative}.lung:before,.lung:after{content:"";position:absolute;top:5px;width:58px;height:84px;border-radius:55% 45% 54% 46%;background:#ffb3ac;box-shadow:inset 0 -11px 0 #e97774;transition:.4s}.lung:before{left:4px;transform:rotate(-8deg)}.lung:after{right:4px;transform:rotate(8deg)}.lung.dark:before,.lung.dark:after{background:#b66b66;box-shadow:inset 0 -11px 0 #6f403d}.pack{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--ink);padding:12px 14px;border-radius:15px;font-size:13px}.pack b{font-size:16px}.record{width:100%;border:0;border-radius:17px;background:#fff;color:var(--green);font-size:16px;font-weight:800;padding:15px;margin-top:14px}.record.new{background:#fff5e9;color:var(--orange)}.notice{font-size:12px;line-height:1.5;margin:11px 2px 0;color:#d9eee4}.notice.warn{color:#ffe0ad;font-weight:700}.section{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 10px}.section h2{font-size:18px;margin:0}.section span{font-size:12px;color:#678076}.search{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;padding:12px;font:inherit;color:var(--ink);margin-bottom:9px}.hint{font-size:12px;color:#71857c;margin:0 2px 9px}.catalog,.picker{display:grid;gap:9px}.picker{display:none;margin-top:12px}.picker.show{display:grid}.picker h3{font-size:14px;margin:0 0 2px}.item,.choice{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;justify-content:space-between;align-items:center;text-align:left;font:inherit;color:var(--ink)}.item b,.choice b{font-size:15px}.item small,.choice small{display:block;color:#70857b;margin-top:4px}.price{text-align:right;color:var(--green);font-weight:800}.price small{color:#71857c;font-weight:500}.choice{border:0;border-radius:13px}.picker .choice{border:1px solid #e4eee8}.choice span{font-size:12px;color:var(--green);font-weight:800}.chips{display:flex;gap:7px;overflow:auto;margin:0 0 10px;padding-bottom:2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:8px 10px;font:inherit;font-size:12px}.load{background:#fff;border:1px solid var(--line);border-radius:16px;color:#71857c;padding:16px;text-align:center;font-size:13px}.foot{font-size:11px;line-height:1.6;color:#73857d;margin:20px 4px 0}
</style></head><body><main>
<div class="top"><div><div class="eyebrow">SMOKE LOG · 手机模型</div><h1>烟迹</h1></div><div class="date">今天</div></div>
<section class="card today"><small>今日已抽</small><div class="number"><span id="count">4</span><small> 根</small></div><div id="lung" class="lung"></div><div class="pack"><div>当前烟包<br><b id="brand">玉溪（合顺）</b></div><div>剩余 <b><span id="remaining">16</span>/20</b> 根</div></div><button id="record" class="record" onclick="add()">记录一根</button><div id="notice" class="notice">今日已抽只会累计增加；换新烟包不会清零。</div><div id="picker" class="picker"><h3>选择要重新添加的烟包</h3><div id="favoritePicker"></div><input id="pickerSearch" class="search" placeholder="搜索品牌或规格" oninput="renderPicker(this.value)"><div id="pickerList"></div></div></section>
<div class="section"><h2>烟的类目</h2><span id="catalogCount">正在加载全部目录…</span></div><input id="catalogSearch" class="search" placeholder="搜索全部香烟品牌或规格" oninput="renderCatalog(this.value)"><p class="hint">常抽的烟会记住并优先显示。目录仅收录每包 20 根的大陆卷烟。</p><div id="favorites" class="chips"></div><section id="catalog" class="catalog"><div class="load">正在加载完整烟类目录…</div></section>
<p class="foot">规则：当前烟包减至 0 后，必须在下一级目录中选择一包烟；选好后才会恢复 20 根，继续记录时今日数量才会再增加。</p>
</main><script>
let catalog=[],current={name:'玉溪（合顺）',pack:30,carton:300};const count=document.getElementById('count'),remaining=document.getElementById('remaining'),lung=document.getElementById('lung'),record=document.getElementById('record'),notice=document.getElementById('notice');
function add(){const left=+remaining.textContent;if(left<=0){needPack();return}count.textContent=+count.textContent+1;remaining.textContent=left-1;if(+count.textContent>=8)lung.classList.add('dark');if(left-1===0)needPack()}
function needPack(){record.textContent='选择新烟包';record.classList.add('new');record.onclick=showPicker;notice.textContent='本包已抽完。请先选择并添加新烟包，才能继续记录与累计。';notice.classList.add('warn')}
function showPicker(){document.getElementById('picker').classList.add('show');record.style.display='none';notice.textContent='请选择下一包烟的品牌与价格。';renderPicker('')}
function choosePack(index){const p=catalog[index];if(!p)return;current=p;document.getElementById('brand').textContent=p.name;remaining.textContent=20;document.getElementById('picker').classList.remove('show');record.style.display='block';record.textContent='记录一根';record.classList.remove('new');record.onclick=add;notice.textContent='已添加 '+p.name+'，今日已抽 '+count.textContent+' 根不会清零。';notice.classList.remove('warn');remember(p);renderFavorites()}
function favorites(){try{return JSON.parse(localStorage.getItem('yanji-frequent')||'[]')}catch(e){return[]}}
function remember(p){const all=favorites().filter(function(x){return x.name!==p.name});all.unshift({name:p.name,pack:p.pack,carton:p.carton});localStorage.setItem('yanji-frequent',JSON.stringify(all.slice(0,6)))}
function favoriteHtml(p){const i=catalog.findIndex(function(x){return x.name===p.name&&x.carton===p.carton});return '<button class="chip" onclick="choosePack('+i+')">'+p.name+'</button>'}
function renderFavorites(){const f=favorites();document.getElementById('favorites').innerHTML=f.length?f.map(favoriteHtml).join(''):'<span class="hint">还没有常抽记录</span>';document.getElementById('favoritePicker').innerHTML=f.length?'<small>经常抽的烟</small><div class="chips">'+f.map(favoriteHtml).join('')+'</div>':''}
function itemHtml(p,i,selectable){return '<'+(selectable?'button':'div')+' class="'+(selectable?'choice':'item')+'" '+(selectable?'onclick="choosePack('+i+')"':'')+'><div><b>'+p.name+'</b><small>每包 20 根</small></div><div class="price">¥'+p.pack+'/包<small>¥'+p.carton+'/条</small></div></'+(selectable?'button':'div')+'>'}
function find(query){const q=(query||'').trim().toLowerCase();return catalog.map(function(p,i){return {p:p,i:i}}).filter(function(x){return !q||x.p.name.toLowerCase().includes(q)})}
function renderCatalog(query){const list=find(query).slice(0,50);document.getElementById('catalog').innerHTML=list.length?list.map(function(x){return itemHtml(x.p,x.i,true)}).join(''):'<div class="load">没有找到匹配的香烟</div>'}
function renderPicker(query){const list=find(query).slice(0,50);document.getElementById('pickerList').innerHTML=list.map(function(x){return itemHtml(x.p,x.i,true)}).join('')||'<div class="load">没有找到匹配的香烟</div>'}
function loadCatalog(){const rows=(window.BUNDLED_DOCS&&window.BUNDLED_DOCS.nationalRows||[]).slice(1),seen={};rows.forEach(function(r){const barcode=String(r[0]||''),carton=Number(r[14]),name=String(r[3]||'').replace(/（/g,'(').replace(/）/g,')').trim();if(barcode.indexOf('690')!==0||Number(r[11])!==200||Number(r[12])!==20||!carton||!name)return;const key=name+'|'+carton;if(!seen[key])seen[key]={name:name.replace(/\(/g,'（').replace(/\)/g,'）'),pack:Math.round(carton/10*100)/100,carton:carton}});catalog=Object.keys(seen).map(function(k){return seen[k]}).sort(function(a,b){return a.name.localeCompare(b.name,'zh-CN')});document.getElementById('catalogCount').textContent='已收录 '+catalog.length+' 种';renderCatalog('');renderFavorites()}
function failed(){document.getElementById('catalog').innerHTML='<div class="load">目录加载失败，请刷新页面重试。</div>';document.getElementById('catalogCount').textContent='目录加载失败'}
const s=document.createElement('script');s.src='https://wangzr.com/jycx/js/bundled_docs.js';s.onload=loadCatalog;s.onerror=failed;document.head.appendChild(s);
</script></body></html>
