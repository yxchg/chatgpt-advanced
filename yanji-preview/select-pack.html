<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>烟迹 · 手机模型</title>
<style>
:root{--ink:#18322b;--green:#1d7d5a;--line:#dbe8e0;--paper:#f7fbf8;--orange:#bb6b18}*{box-sizing:border-box}body{margin:0;background:var(--paper);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}main{max-width:480px;margin:auto;min-height:100vh;padding:24px 18px 36px}.eyebrow{font-size:12px;letter-spacing:1.3px;color:#668077}.top{display:flex;justify-content:space-between;align-items:start}.top h1{margin:5px 0 2px;font-size:30px}.date{font-size:13px;color:#71857c;padding-top:9px}.card{margin-top:18px;border:1px solid var(--line);border-radius:24px;background:#fff;padding:20px;box-shadow:0 10px 26px #1c49390a}.today{background:linear-gradient(135deg,#215d48,#1b805b);color:#fff;border:0}.today small{opacity:.75}.number{font-size:58px;line-height:1;font-weight:800;margin:10px 0}.lung{width:126px;height:106px;margin:8px auto 16px;position:relative}.lung:before,.lung:after{content:"";position:absolute;top:5px;width:58px;height:84px;border-radius:55% 45% 54% 46%;background:#ffb3ac;box-shadow:inset 0 -11px 0 #e97774;transition:.4s}.lung:before{left:4px;transform:rotate(-8deg)}.lung:after{right:4px;transform:rotate(8deg)}.lung.dark:before,.lung.dark:after{background:#b66b66;box-shadow:inset 0 -11px 0 #6f403d}.pack{display:flex;justify-content:space-between;align-items:center;background:#fff;color:var(--ink);padding:12px 14px;border-radius:15px;font-size:13px}.pack b{font-size:16px}.record{width:100%;border:0;border-radius:17px;background:#fff;color:var(--green);font-size:16px;font-weight:800;padding:15px;margin-top:14px}.record.new{background:#fff5e9;color:var(--orange)}.notice{font-size:12px;line-height:1.5;margin:11px 2px 0;color:#d9eee4}.notice.warn{color:#ffe0ad;font-weight:700}.picker{display:none;margin-top:12px;gap:8px}.picker.show{display:grid}.picker small{color:#d9eee4}.choice{display:flex;justify-content:space-between;align-items:center;border:0;border-radius:13px;background:#fff;color:var(--ink);padding:11px 12px;text-align:left;font:inherit}.choice b{font-size:13px}.choice span{font-size:12px;color:var(--green);font-weight:800}.section{display:flex;justify-content:space-between;align-items:center;margin:25px 2px 10px}.section h2{font-size:18px;margin:0}.section span{font-size:12px;color:#678076}.catalog{display:grid;gap:9px}.item{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px;display:flex;justify-content:space-between;align-items:center}.item b{font-size:15px}.item small{display:block;color:#70857b;margin-top:4px}.price{text-align:right;color:var(--green);font-weight:800}.price small{color:#71857c;font-weight:500}.foot{font-size:11px;line-height:1.6;color:#73857d;margin:20px 4px 0}
</style></head>
<body><main><div class="top"><div><div class="eyebrow">SMOKE LOG · 手机模型</div><h1>烟迹</h1></div><div class="date">今天</div></div>
<section class="card today"><small>今日已抽</small><div class="number"><span id="count">4</span><small> 根</small></div><div id="lung" class="lung"></div><div class="pack"><div>当前烟包<br><b id="brand">玉溪（合顺）</b></div><div>剩余 <b><span id="remaining">16</span>/20</b> 根</div></div><button id="record" class="record" onclick="add()">记录一根</button><div id="notice" class="notice">每记录一根，当前烟包减少一根。</div><div id="picker" class="picker"><small>选择要重新添加的烟包</small><button class="choice" onclick="choosePack('中华（软）')"><b>中华（软）<br><small>20 根/包 · ¥65/包</small></b><span>¥650/条</span></button><button class="choice" onclick="choosePack('玉溪（合顺）')"><b>玉溪（合顺）<br><small>20 根/包 · ¥30/包</small></b><span>¥300/条</span></button><button class="choice" onclick="choosePack('南京（炫赫门）')"><b>南京（炫赫门）<br><small>20 根/包 · ¥18/包</small></b><span>¥180/条</span></button></div></section>
<div class="section"><h2>烟的类目</h2><span>单包 20 根 / 整条</span></div><section class="catalog"><div class="item"><div><b>中华（软）</b><small>每包 20 根</small></div><div class="price">¥65/包<small>¥650/条</small></div></div><div class="item"><div><b>玉溪（合顺）</b><small>每包 20 根</small></div><div class="price">¥30/包<small>¥300/条</small></div></div><div class="item"><div><b>南京（炫赫门）</b><small>每包 20 根</small></div><div class="price">¥18/包<small>¥180/条</small></div></div></section><p class="foot">模型规则：当前烟包减至 0 后，必须重新添加烟包；在新包启用前，不能继续增加抽烟累计。</p>
</main><script>
const count=document.getElementById('count'),remaining=document.getElementById('remaining'),lung=document.getElementById('lung'),record=document.getElementById('record'),notice=document.getElementById('notice');
function add(){const left=+remaining.textContent;if(left<=0){needPack();return}count.textContent=+count.textContent+1;remaining.textContent=left-1;if(+count.textContent>=8)lung.classList.add('dark');if(left-1===0)needPack()}
function needPack(){record.textContent='选择新烟包';record.classList.add('new');record.onclick=showPicker;notice.textContent='本包已抽完。请先选择并添加新烟包，才能继续记录与累计。';notice.classList.add('warn')}
function showPicker(){document.getElementById('picker').classList.add('show');record.style.display='none';notice.textContent='请选择下一包烟的品牌与价格。'}
function choosePack(name){document.getElementById('brand').textContent=name;remaining.textContent=20;document.getElementById('picker').classList.remove('show');record.style.display='block';record.textContent='记录一根';record.classList.remove('new');record.onclick=add;notice.textContent='已添加 '+name+'，现在可以从 20 根开始继续记录。';notice.classList.remove('warn')}
</script></body></html>
